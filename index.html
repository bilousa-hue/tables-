<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Мої таблиці</title>
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #999; padding: 6px 10px; }
    th { background: #eee; }
  </style>
</head>
<body>
  <h1>Мої таблиці</h1>
<h2>Оцінки</h2>
<table>
  <tr>
    <th>Ім'я</th>
    <th>Оцінка</th>
  </tr>
  <tr>
    <td>Олена</td>
    <td>11</td>
  </tr>
  <tr>
    <td>Максим</td>
    <td>9</td>
  </tr>
</table>
<table>
  <caption>Розклад 6-А класу</caption>
  <thead>
    <tr>
      <th scope="col">№</th>
      <th scope="col">Пн</th>
      <th scope="col">Вт</th>
      <th scope="col">Ср</th>
      <th scope="col">Чт</th>
      <th scope="col">Пт</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">1</th>
      <td>Математика</td>
      <td>Історія</td>
      <td rowspan="2">Фізкультура</td>
      <td>Англійська</td>
      <td>Математика</td>
    </tr>
    <tr>
      <th scope="row">2</th>
      <td>Українська</td>
      <td>Математика</td>
      <td>Природа</td>
      <td>Інформатика</td>
    </tr>
    <tr>
      <td colspan="6">Велика перерва</td>
    </tr>
    <tr>
      <th scope="row">3</th>
      <td>Англійська</td>
      <td>Музика</td>
      <td>Українська</td>
      <td>Математика</td>
      <td>Мистецтво</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <th scope="row">Уроків</th>
      <td>3</td>
      <td>3</td>
      <td>3</td>
      <td>3</td>
      <td>3</td>
    </tr>
  </tfoot>
</table>
</body>
</html>
